<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>想吃梨儿童美术 · 美育教务工作台</title>
  
  <!-- 防止 Vue 挂载前模板插值和模态窗闪烁 -->
  <style>
    [v-cloak] {
      display: none !important;
    }
  </style>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pear: {
              DEFAULT: '#10E57A',
              light: '#5FF1A6',
              dark: '#0AA554',
              soft: '#EAFBF1',
              accent: '#F9D423'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Noto Sans SC', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- FontAwesome 图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- 自定义线框模式样式库 -->
  <link rel="stylesheet" href="style.css">

  <!-- 本地极速 Vue 3 核心包 (兼具 CDN 容灾) -->
  
  <script>
    if (typeof Vue === 'undefined') {
      document.write('<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"><\/script>');
    }
  </script>
</head>
<body class="min-h-screen text-xs sm:text-sm antialiased font-sans select-none" style="background-color: var(--bg-page); color: var(--text-main);">

  <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

  <!-- 机构初始默认数据与控制器脚本 -->
  
  
</body>
</html>
